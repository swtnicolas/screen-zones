name: Release

on:
  push:
    tags: ["linux-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test
        run: bash scripts/test.sh

      - name: Package
        run: bash scripts/package.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/screenzones-install.sh --title "ScreenZones para KDE Plasma ${GITHUB_REF_NAME#linux-v}" --generate-notes
